name: build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release 版本号（例如 v1.0.0）'
        type: string
        required: true

env:
  IS_THIS_RELEASE: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Java 25 warns when legacy Guava/JOML code uses Unsafe during remapping.
  # This is a third-party compatibility path, not Printer code.
  GRADLE_OPTS: --sun-misc-unsafe-memory-access=allow

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Loom workspace
        uses: actions/cache@v5
        with:
          path: ./.gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build fabricWrapper subproject
        run: ./gradlew :fabricWrapper:build --stacktrace --console=plain

      - name: Delete wrapper sources jar
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete

      - name: Capture versionpack
        uses: actions/upload-artifact@v7
        with:
          name: versionpack
          path: fabricWrapper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Capture standalone version JARs
        uses: actions/upload-artifact@v7
        with:
          name: version-jars
          path: fabricWrapper/build/libs/jars/
          if-no-files-found: error
          retention-days: 90

      - name: Create Release and upload JARs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          name: Release ${{ inputs.release_version }}
          files: |
            fabricWrapper/build/libs/*.jar
            fabricWrapper/build/libs/jars/*.jar
          generate_release_notes: true
          prerelease: true
          make_latest: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}